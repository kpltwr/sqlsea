[package]
name = "sqlsea"
version = "0.1.0"
edition = "2024"
description = "A small native database client for PostgreSQL and SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kpltwr/sqlsea"
homepage = "https://github.com/kpltwr/sqlsea"
readme = "README.md"
keywords = ["database", "postgres", "sqlite", "sql", "gui"]
categories = ["database", "gui"]

[dependencies]
dirs-next = "2.0.0"
iced = { version = "0.14", features = ["tokio", "advanced", "image-without-codecs"] }
keyring = "4.2"
png = "0.18.1"
rfd = "0.17.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[features]
# Scripted screenshots for design review: SQLSEA_SCRIPT="...;shot:/tmp/a.png;quit"
shot = []

# Smaller and faster release builds. The build takes longer.
[profile.release]
lto = "fat"
codegen-units = 1
# A panic closes the app at once. This removes the unwind code.
panic = "abort"
strip = true

# These crates do not run while the app draws, so they are built for size.

[profile.release.package.zbus]
opt-level = "s"

[profile.release.package.zvariant]
opt-level = "s"

[profile.release.package.secret-service]
opt-level = "s"

[profile.release.package.keyring]
opt-level = "s"

[profile.release.package.keyring-core]
opt-level = "s"

[profile.release.package.zbus-secret-service-keyring-store]
opt-level = "s"

[profile.release.package.mundy]
opt-level = "s"

[profile.release.package.rfd]
opt-level = "s"

[profile.release.package.russh]
opt-level = "s"

[profile.release.package.ssh-key]
opt-level = "s"

[profile.release.package.ssh-encoding]
opt-level = "s"

[profile.release.package.crypto-bigint]
opt-level = "s"

[profile.release.package.rsa]
opt-level = "s"

[profile.release.package.naga]
opt-level = "s"

[dev-dependencies]
resvg = "0.49.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
