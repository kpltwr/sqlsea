[package]
name = "sqlsea"
version = "0.1.0"
edition = "2024"
description = "A small native database client for PostgreSQL and SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kpltwr/sqlsea"
homepage = "https://github.com/kpltwr/sqlsea"
readme = "README.md"
keywords = ["database", "postgres", "sqlite", "sql", "gui"]
categories = ["database", "gui"]

[dependencies]
dirs-next = "2.0.0"
iced = { version = "0.14", features = ["tokio", "advanced", "svg"] }
keyring = "4.2"
png = "0.18.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[features]
# Scripted screenshots for design review: SQLSEA_SCRIPT="...;shot:/tmp/a.png;quit"
shot = []

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
resvg = "0.49.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
